<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novedades · El Capricho de Costa del Silencio</title>
<meta name="description" content="Novedades de El Capricho de Costa del Silencio: catas especiales, productos nuevos y noticias de nuestra tienda gourmet en Tenerife.">
<meta property="og:title" content="Novedades · El Capricho de Costa del Silencio">
<meta property="og:description" content="Catas especiales, productos nuevos y noticias de nuestra tienda gourmet en Tenerife.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://elcaprichodecostadelsilencio.com/novedades.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Playfair+Display:wght@600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%2314192B'/%3E%3Ctext x='50' y='66' text-anchor='middle' font-size='54' fill='%23C9A227' font-family='Georgia,serif'%3EC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/site.css">
<script src="https://api.biscotti-cmp.com/scripts/biscotti-boot.js"></script>
<script>
window.BiscottiConfig = {
websiteId: "3cb3f3db-aba1-4e80-b52c-1565b251f432",
apiUrl: "https://api.biscotti-cmp.com/api/v1"
};
</script>
<script src="https://api.biscotti-cmp.com/scripts/biscotti.min.js" defer></script>
</head>
<body>

<div id="site-header-slot"></div>


<section class="novedades-hero">
  <div class="wrap">
    <span class="eyebrow" data-i18n="novedades_eyebrow">Últimas noticias</span>
    <h1><span data-i18n="novedades_title1">Lo nuevo en</span><span class="accent" data-i18n="novedades_title2">El Capricho</span></h1>
  </div>
</section>

<section class="novedades-list">
  <div class="wrap">
    <div class="nov-grid" id="novGrid">
      <div class="nov-empty" data-i18n="novedades_empty">Todavía no hay novedades publicadas. Vuelve pronto.</div>
    </div>
  </div>
</section>

<div id="site-footer-slot"></div>

<script src="assets/i18n.js"></script>
<script>
  let novedadesCache = null;
  async function renderPosts(lang){
    const grid = document.getElementById('novGrid');
    try{
      if (!novedadesCache){
        const res = await fetch('novedades-data.json', {cache: 'no-store'});
        novedadesCache = (await res.json()).posts || [];
      }
      const posts = [...novedadesCache].sort((a,b) => new Date(b.date) - new Date(a.date));
      if (!posts.length){
        grid.innerHTML = `<div class="nov-empty">${I18N[lang].novedades_empty}</div>`;
        return;
      }
      grid.innerHTML = posts.map(p => {
        const title = lang === 'en' ? (p.title_en || p.title_es) : p.title_es;
        const excerpt = lang === 'en' ? (p.excerpt_en || p.excerpt_es) : p.excerpt_es;
        const dateStr = new Date(p.date + 'T00:00:00').toLocaleDateString(lang === 'en' ? 'en-GB' : 'es-ES', {day:'numeric', month:'long', year:'numeric'});
        return `<article class="nov-card">
          <div class="thumb"><img src="${p.image}" alt="${title}" loading="lazy"></div>
          <div class="body">
            <div class="nov-date">${dateStr}</div>
            <h3>${title}</h3>
            <p>${excerpt}</p>
            <a class="read-more" href="novedades/${p.slug}.html">${I18N[lang].read_more}</a>
          </div>
        </article>`;
      }).join('');
    }catch(err){
      grid.innerHTML = `<div class="nov-empty">${I18N[lang].novedades_empty}</div>`;
    }
  }
  function onLanguageChange(lang){ renderPosts(lang); }
</script>
<script>window.SITE_PREFIX = "";</script>
<script src="assets/site-common.js"></script>
<script>renderPosts(localStorage.getItem('capricho_lang') || 'es');</script>

</body>
</html>
